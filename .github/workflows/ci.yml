name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The fuzz targets (fuzz/, outside the workspace) run weekly on
      # nightly (fuzz.yml); type-check them here so a core API change
      # that breaks them shows up on the pull request. Stable is enough
      # to check; only running them needs nightly. The theme target is
      # left out: it would build wgpu a second time.
      - name: Check the fuzz targets
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --features app-config

  # Licences and advisories for every dependency, from deny.toml (M15).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  release-size:
    name: release binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo build --release -p nimbus
      - name: Enforce 35 MB budget (DESIGN.md §5)
        shell: bash
        run: |
          size=$(stat -c %s target/release/nimbus)
          echo "nimbus release binary: $((size / 1024 / 1024)) MB ($size bytes)"
          test "$size" -le $((35 * 1024 * 1024))
