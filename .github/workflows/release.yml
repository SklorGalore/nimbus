# Release builds (M8, extended in M15): push a tag like v0.8.0 and this
# makes a draft GitHub release with a package for each platform attached.
# Check the draft, then publish it on GitHub.
#
# Before tagging, set the same version in Cargo.toml ([workspace.package]):
# the first job refuses a tag that does not match, so the app's --version
# and the release always agree.
#
# Packages (every build is unsigned; the README says how to get past the
# first-run warnings on macOS and Windows):
#   Nimbus-VERSION-macos.dmg            Nimbus.app with an Applications
#                                       shortcut; one binary for Apple
#                                       silicon and Intel (joined with lipo)
#   Nimbus-VERSION-macos.zip            the same app, zipped
#   nimbus-VERSION-linux-x86_64.tar.gz  the binary, an icon and a .desktop
#                                       file; built on the oldest supported
#                                       Ubuntu so it runs on older systems
#   nimbus_VERSION_amd64.deb            the same, installed by apt or dpkg
#   Nimbus-VERSION-x86_64.AppImage      the same, as one runnable file
#   nimbus-VERSION-windows-x86_64-setup.exe  installer (Inno Setup): Start
#                                       Menu entry, "Open with Nimbus"
#   nimbus-VERSION-windows-x86_64.zip   nimbus.exe (icon embedded) and the
#                                       icon file, for no installer
#   nimbus.rb                           Homebrew cask, filled in from the
#                                       packages above
#   nimbus.VERSION.nupkg                Chocolatey package, made after
#                                       SHA256SUMS (chocolatey.yml)
#   SHA256SUMS                          each package's SHA-256, made last
#   SHA256SUMS.minisig                  its signature, added afterwards by
#                                       scripts/sign-release.sh on the
#                                       owner's Mac (docs/releasing.md)
#
# Hardening (M26, docs/security.md): every token starts read-only and each
# job asks for what it needs; the first job runs in the `release`
# environment, which waits for the owner's approval, and everything else
# waits for it; nothing is restored from a cache, so a poisoned cache from
# a pull request cannot reach a release; every build uses Cargo.lock as
# committed (--locked) and records its dependency list in the binary
# (cargo auditable); every package gets a build provenance attestation.
#
# Signing a package (Developer ID, notarisation, Authenticode) is not done:
# the owner has no Apple Developer account or Windows certificate. If one
# is bought later, its steps go in the build job behind `if: env.SECRET
# != ''`, so forks and test tags keep working.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-auditable embeds the dependency list (a compressed copy of
  # Cargo.lock's names and versions, a few KB) in the binary, so
  # `cargo audit bin nimbus` can check a shipped copy for advisories.
  CARGO_AUDITABLE_VERSION: 0.7.7
  # appimagetool by exact version and hash, never "continuous": the file is
  # run with this job's token in scope. scripts/pin-actions.sh fills in the
  # hash for a new version.
  APPIMAGETOOL_VERSION: "1.9.0"
  APPIMAGETOOL_SHA256: "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1"

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    # The owner approves each release here (Settings > Environments >
    # release: required reviewer, tags v* only). The other jobs need this
    # one, so nothing builds or uploads before that click.
    environment: release
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $tag, Cargo.toml $version"
          test "$tag" = "$version"
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's CHANGELOG section, when
          # there is one, over a standing note about the unsigned builds.
          notes=$(awk -v v="## $version" '
            index($0, v) == 1 { on = 1; next }
            /^## / && on { exit }
            on { print }' CHANGELOG.md)
          {
            printf '%s\n\n' "$notes"
            echo "Unsigned builds. On macOS, open Nimbus.app the first time with right-click > Open (or run \`xattr -d com.apple.quarantine /Applications/Nimbus.app\`). On Windows, SmartScreen's \"More info\" > \"Run anyway\" runs the installer. See the README for checking the SHA256SUMS signature."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Nimbus $version" --notes-file notes.md

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    permissions:
      contents: write # upload packages to the draft
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation with the repository
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version "$CARGO_AUDITABLE_VERSION"

      - name: macOS app, zip and dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo auditable build --release --locked -p nimbus --target aarch64-apple-darwin
          cargo auditable build --release --locked -p nimbus --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/nimbus \
            target/aarch64-apple-darwin/release/nimbus \
            target/x86_64-apple-darwin/release/nimbus
          lipo -info dist/nimbus
          zip=$(scripts/bundle-macos.sh dist/nimbus "$version" dist)
          dmg=$(scripts/dmg-macos.sh dist/Nimbus.app "$version" dist)
          gh release upload "$GITHUB_REF_NAME" "$zip" "$dmg" --clobber
          mkdir -p attest && cp "$zip" "$dmg" attest/

      - name: Linux tarball, deb and AppImage
        if: matrix.name == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
          version="${GITHUB_REF_NAME#v}"
          cargo auditable build --release --locked -p nimbus
          name="nimbus-$version-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/nimbus "dist/$name/"
          cp assets/icon/nimbus-1024.png "dist/$name/nimbus.png"
          cp assets/linux/nimbus.desktop "dist/$name/"
          cp LICENSE "dist/$name/"
          cp crates/render/assets/HackNerdFont-LICENSE.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          deb=$(scripts/deb-linux.sh target/release/nimbus "$version" dist)
          dpkg-deb --info "$deb"
          if [ -z "$APPIMAGETOOL_SHA256" ]; then
            echo "APPIMAGETOOL_SHA256 is empty: run scripts/pin-actions.sh and commit the result." >&2
            exit 1
          fi
          curl -fsSL -o dist/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  dist/appimagetool" | sha256sum -c -
          chmod +x dist/appimagetool
          image=$(scripts/appimage-linux.sh target/release/nimbus "$version" dist dist/appimagetool)
          gh release upload "$GITHUB_REF_NAME" "dist/$name.tar.gz" "$deb" "$image" --clobber
          mkdir -p attest && cp "dist/$name.tar.gz" "$deb" "$image" attest/

      - name: Windows zip and installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          cargo auditable build --release --locked -p nimbus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "nimbus-$version-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/nimbus.exe "dist/$name/"
          Copy-Item assets/icon/nimbus.ico "dist/$name/"
          Copy-Item LICENSE "dist/$name/"
          Copy-Item crates/render/assets/HackNerdFont-LICENSE.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          # Inno Setup is on every windows-latest runner.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DVersion=$version" "/DSource=$PWD\dist\$name" "/DOut=$PWD\dist" packaging\windows\nimbus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:GITHUB_REF_NAME "dist/$name.zip" "dist/$name-setup.exe" --clobber
          New-Item -ItemType Directory -Force attest | Out-Null
          Copy-Item "dist/$name.zip", "dist/$name-setup.exe" attest/

      # A signed statement, made by GitHub's builder, that these files came
      # from this commit and this workflow. Anyone can check a download with
      # `gh attestation verify FILE --repo SklorGalore/nimbus` (README).
      - name: Build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: attest/*

  # Once every package is attached: a SHA256SUMS file listing each one's
  # SHA-256 hash, so a download can be checked for damage with
  # `sha256sum -c SHA256SUMS --ignore-missing` (Linux) or
  # `shasum -a 256 -c SHA256SUMS --ignore-missing` (macOS). It is computed
  # from the files as uploaded, read back from the release. The package
  # manifests take their hashes from the same files.
  #
  # SHA256SUMS is signed afterwards on the owner's Mac by
  # scripts/sign-release.sh, never here: a key in GitHub would let anyone
  # who can run a workflow sign an update (M26, docs/security.md).
  checksums:
    name: SHA256SUMS and manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SHA256SUMS and the manifests
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hash the attached packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --pattern '*.tar.gz' --pattern '*.dmg' \
            --pattern '*.deb' --pattern '*.AppImage' --pattern '*-setup.exe'
          ls -l
          test "$(ls | wc -l)" -eq 7
          # Install Update (M31, crates/app/src/update/install.rs) builds
          # these names from the tag; a renamed package breaks updating.
          for name in "Nimbus-$version-macos.zip" "Nimbus-$version-x86_64.AppImage" \
            "nimbus-$version-linux-x86_64.tar.gz" "nimbus-$version-windows-x86_64-setup.exe"; do
            test -f "$name" || { echo "missing $name, which the updater downloads"; exit 1; }
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          scripts/manifests.sh "$version" dist
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS dist/nimbus.rb \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The Chocolatey package needs a Windows runner for `choco pack`, and the
  # installer's hash from SHA256SUMS, so it is made last.
  chocolatey:
    name: Chocolatey package
    needs: checksums
    permissions:
      contents: write # attach the .nupkg to the release
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ github.ref_name }}
