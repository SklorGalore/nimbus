name: Screenshot reference

# Remakes crates/app/tests/screenshot/reference.bmp on a macOS runner after
# an intended drawing change, for anyone without a Mac at hand. Run it on
# the branch with the change (from the Actions tab, or by putting the
# "remake-screenshot" label on its pull request), download the
# "screenshot-reference" artifact, look at the image, and commit it.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  reference:
    name: remake reference.bmp
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'remake-screenshot'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render the reference frame
        run: NIMBUS_UPDATE_SCREENSHOT=1 cargo test -p nimbus --test screenshot
      - name: Check the new reference passes
        run: cargo test -p nimbus --test screenshot
      - name: Print the image too, for machines that cannot download artifacts
        run: |
          echo "::group::reference.bmp, gzip then base64"
          gzip -9 -c crates/app/tests/screenshot/reference.bmp | base64
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-reference
          path: crates/app/tests/screenshot/reference.bmp
          if-no-files-found: error
