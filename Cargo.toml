[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"

# Strict lints, inherited by every crate via `[lints] workspace = true`.
# CI runs clippy with -D warnings, so any of these warnings fails the build.
# Silence one only with #[expect(lint, reason = "...")] on the narrowest item.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

# Release profile tuned for a small, fast single binary (DESIGN.md §5).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds reasonably fast to run: optimize dependencies only.
[profile.dev.package."*"]
opt-level = 2
