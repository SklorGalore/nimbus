# Nimbus light theme. See dark.toml for the format. Like the dark theme,
# amber is the one accent, here a deeper burnt amber so a thin cursor
# stays visible on a light background (3.8:1); the background and chrome
# are a warm paper, the cream of the icon's cloud.

[ui]
background = "#fbf9f4"
text = "#383a42"
gutter = "#8f897d"
current_line_number = "#383a42"
cursor = "#b86e00"
preedit = "#b86e00"
selection = "#2b2f3b24"
bracket = "#8f897d40"
scrollbar = "#6b7385b3"
find_match = "#f0c04070"
current_match = "#e0a020b0"
bar = "#efebe3"
field = "#ffffff"
field_focus = "#b86e00"
toggle_on = "#f6d18a"
error = "#d43c3c"
tab_bar = "#e8e3d9"
tab_active = "#fbf9f4"
tab_accent = "#b86e00"
picker = "#f4f1ea"
picker_border = "#d3ccbe"
picker_selected = "#2b2f3b1f"
search_match = "#f0c04070"
search_file = "#2a5db0"
diff_added = "#dcf2e1"
diff_removed = "#fadcdc"
diff_changed = "#f6eccb"
diff_word = "#8fcf9a66"
diff_filler = "#efece5"
merge_conflict = "#f6c9c9"

[syntax]
attribute = "#0184bc"
boolean = "#986801"
comment = "#a0a1a7"
constant = "#986801"
constructor = "#c18401"
embedded = "#383a42"
escape = "#0184bc"
function = "#4078f2"
"function.macro" = "#0184bc"
keyword = "#a626a4"
label = "#0184bc"
number = "#986801"
operator = "#383a42"
property = "#e45649"
punctuation = "#696c77"
"punctuation.special" = "#a626a4"
string = "#50a14f"
"string.escape" = "#0184bc"
"string.special" = "#0184bc"
"string.special.key" = "#e45649"
tag = "#e45649"
"text.emphasis" = { italic = true }
"text.literal" = "#50a14f"
"text.reference" = "#a626a4"
"text.strong" = { bold = true }
"text.title" = "#4078f2"
"text.uri" = "#0184bc"
type = "#c18401"
"variable.builtin" = "#e45649"
