# Nimbus dark theme. Copy this file to themes/NAME.toml in the config
# directory and set `theme = "NAME"` to make your own; settings you leave
# out come from `base` ("dark" unless given).
#
# Colours are "#rrggbb" or "#rrggbbaa". Syntax keys are tree-sitter capture
# names; the longest matching prefix wins, so `function` also colours
# `function.method` unless that has its own entry.

[ui]
background = "#1a1c22"
text = "#d9dee8"
gutter = "#6b7385"
current_line_number = "#bfc7d6"
cursor = "#fabf4c"
preedit = "#fabf4c"
selection = "#405c8ca6"
bracket = "#6b738566"
scrollbar = "#8a93a6b3"
find_match = "#8c732673"
current_match = "#d99e33b2"
bar = "#24262e"
field = "#14171c"
field_focus = "#4c6b9e"
toggle_on = "#4c6b9e"
error = "#f2736b"
tab_bar = "#1c1f24"
tab_active = "#1a1c22"
tab_accent = "#fabf4c"
picker = "#292b36"
picker_border = "#4c5261"
picker_selected = "#405c8cd9"

[syntax]
attribute = "#56b6c2"
boolean = "#d19a66"
comment = "#7a8294"
constant = "#d19a66"
constructor = "#e5c07b"
embedded = "#d9dee8"
escape = "#56b6c2"
function = "#61afef"
"function.macro" = "#56b6c2"
keyword = "#c678dd"
label = "#56b6c2"
number = "#d19a66"
operator = "#a9b1c1"
property = "#e06c75"
punctuation = "#8f97a6"
"punctuation.special" = "#c678dd"
string = "#98c379"
"string.escape" = "#56b6c2"
"string.special" = "#56b6c2"
"string.special.key" = "#e06c75"
tag = "#e06c75"
"text.literal" = "#98c379"
"text.reference" = "#c678dd"
"text.title" = "#61afef"
"text.uri" = "#56b6c2"
type = "#e5c07b"
"variable.builtin" = "#e06c75"
