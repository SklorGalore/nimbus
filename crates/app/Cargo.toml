[package]
name = "nimbus"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3", default-features = false }
env_logger = "0.11.11"
log = "0.4.34"
nimbus-core = { version = "0.1.0", path = "../core" }
