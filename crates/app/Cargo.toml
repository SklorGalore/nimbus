[package]
name = "nimbus"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
arboard = { version = "3", default-features = false }
dirs = "7"
encoding_rs = "0.8.42"
env_logger = "0.11.11"
globset = "0.4"
ignore = "0.4"
log = "0.4.34"
memchr = "2.8.3"
memmap2 = "0.9"
nimbus-core = { version = "0.4.0", path = "../core" }
nimbus-render = { version = "0.1.0", path = "../render" }
nimbus-syntax = { version = "0.2.1", path = "../syntax" }
notify = "8.2.0"
nucleo = "0.5"
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-segmentation = "1.13.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
winit = "0.30"

[features]
default = []
# East Asian encodings (Shift_JIS, EUC-JP, ISO-2022-JP, GBK, GB18030, Big5,
# EUC-KR) in the encoding pickers, --encoding and the config's [encodings]
# table. Off by default (DESIGN.md §9): sniffing them is unreliable, so
# they are offered only by explicit choice.
east-asian = []

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"
