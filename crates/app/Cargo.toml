[package]
name = "nimbus"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
arboard = { version = "3", default-features = false }
dirs = "7"
encoding_rs = "0.8.42"
env_logger = "0.11.11"
globset = "0.4"
ignore = "0.4"
log = "0.4.34"
memchr = "2.8.3"
memmap2 = "0.9"
nimbus-core = { version = "0.7.2", path = "../core" }
nimbus-render = { version = "0.3.0", path = "../render" }
nimbus-syntax = { version = "0.3.0", path = "../syntax" }
notify = "8.2.0"
nucleo = "0.5"
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"
trash = "5.2.9"
unicode-segmentation = "1.13.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
winit = "0.30"

[features]
default = []
# East Asian encodings (Shift_JIS, EUC-JP, ISO-2022-JP, GBK, GB18030, Big5,
# EUC-KR) in the encoding pickers, --encoding and the config's [encodings]
# table. Off by default (DESIGN.md §9). Their tables are linked either way
# (encoding_rs dispatches at run time; all of encoding_rs costs 0.3 MB), so
# this only decides whether they are offered.
east-asian = []

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }

# The app delegate that receives Finder's Open With (open_with.rs). The
# same versions winit 0.30 already links, so they add almost nothing.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL", "NSObject"] }

[build-dependencies]
embed-resource = "3.0.12"
