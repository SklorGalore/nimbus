[package]
name = "nimbus"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
arboard = { version = "3", default-features = false }
dirs = "7"
env_logger = "0.11.11"
ignore = "0.4"
log = "0.4.34"
memmap2 = "0.9"
nimbus-core = { version = "0.2.0", path = "../core" }
nimbus-render = { version = "0.1.0", path = "../render" }
nimbus-syntax = { version = "0.1.0", path = "../syntax" }
notify = "8.2.0"
nucleo = "0.5"
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-segmentation = "1.13.3"
winit = "0.30"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.21"

[build-dependencies]
embed-resource = "3.0.12"
