[package]
name = "nimbus-render"
version = "0.4.0"
edition = "2024"
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdb = "0.24.0"
log = "0.4.34"
nimbus-core = { version = "0.7.2", path = "../core" }
pollster = "1.0.1"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
swash = "0.2.10"
unicode-segmentation = "1.13.3"
wgpu = "30.0.1"
winit = "0.30"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
